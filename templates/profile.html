<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil - WANDJI FINANCE</title>

    <link rel="stylesheet" href="{{url_for('static',filename='css/base.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dashboard.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/account.css')}}">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="{{url_for('dashboard')}}" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="{{url_for('dashboard')}}">Tableau de bord</a>
                <a href="{{url_for('transactions')}}">Transactions</a>
                <a href="{{url_for('statistics')}}">Statistiques</a>
                <a href="{{url_for('revenues')}}">Revenus</a>
                <a href="{{url_for('expenses')}}">Dépenses</a>
                <a href="{{url_for('budgets')}}">Budgets</a>
                <a href="{{url_for('goals')}}">Objectifs</a>
                <a href="{{url_for('profile')}}" class="active">Profil</a>
                <a href="{{url_for('notifications')}}">Notifications</a>
                <a href="{{url_for('settings')}}">Paramètres</a>

            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        COMPTE
                    </span>

                    <h1>
                        Mon profil
                    </h1>

                    <p>
                        Gérez vos informations personnelles.
                    </p>

                </div>

            </header>


            <section class="account-card">

                <div class="profile-avatar">
                    W
                </div>

                <div class="profile-info">

                    <h2>{{nom_complet}}</h2>

                    <p>{{email}}</p>

                    <span>Membre depuis {{date_creation}}</span>

                </div>

            </section>


            <section class="form-card">

                <form method="POST">

                    <div class="form-group">

                        <label for="name">
                            Nom complet
                        </label>

                        <input class="name"
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Modifier le nom"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Adresse email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Modifier l'email"
                        >

                    </div>


                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Enregistrer les modifications
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
