<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil - WANDJI FINANCE</title>

    <link rel="stylesheet" href="{{url_for('static',filename='css/base.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dashboard.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/account.css')}}">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="dashboard.html" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="transactions.html">Transactions</a>
                <a href="statistics.html">Statistiques</a>
                <a href="revenues.html">Revenus</a>
                <a href="expenses.html">Dépenses</a>
                <a href="budgets.html">Budgets</a>
                <a href="goals.html">Objectifs</a>
                <a href="profile.html" class="active">Profil</a>
                <a href="notifications.html">Notifications</a>
                <a href="settings.html">Paramètres</a>

            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        COMPTE
                    </span>

                    <h1>
                        Mon profil
                    </h1>

                    <p>
                        Gérez vos informations personnelles.
                    </p>

                </div>

            </header>


            <section class="account-card">

                <div class="profile-avatar">
                    W
                </div>

                <div class="profile-info">

                    <h2>
                        Wandji Modeste
                    </h2>

                    <p>
                        modeste@example.com
                    </p>

                    <span>
                        Membre depuis octobre 2026
                    </span>

                </div>

            </section>


            <section class="form-card">

                <form>

                    <div class="form-group">

                        <label for="name">
                            Nom complet
                        </label>

                        <input
                            type="text"
                            id="name"
                            value="Wandji Modeste"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Adresse email
                        </label>

                        <input
                            type="email"
                            id="email"
                            value="modeste@example.com"
                        >

                    </div>


                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Enregistrer les modifications
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
