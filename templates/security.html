<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sécurité - WANDJI FINANCE</title>

    <link rel="stylesheet" href="{{url_for('static',filename='css/base.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dashboard.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/account.css')}}">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="{{url_for('dashboard')}}" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="{{url_for('dashboard')}}">Tableau de bord</a>
                <a href="{{url_for('transactions')}}">Transactions</a>
                <a href="{{url_for('profile')}}">Profil</a>
                <a href="{{url_for('security')}}" class="active">Sécurité</a>
                <a href="{{url_for('settings')}}">Paramètres</a>


            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        COMPTE
                    </span>

                    <h1>
                        Sécurité
                    </h1>

                    <p>
                        Protégez votre compte et vos informations.
                    </p>

                </div>

            </header>


            <section class="form-card">

                <h2>
                    Modifier le mot de passe
                </h2>

                <form>

                    <div class="form-group">

                        <label for="current">
                            Mot de passe actuel
                        </label>

                        <input
                            type="password"
                            id="current"
                        >

                    </div>


                    <div class="form-group">

                        <label for="new-password">
                            Nouveau mot de passe
                        </label>

                        <input
                            type="password"
                            id="new-password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirm">
                            Confirmer
                        </label>

                        <input
                            type="password"
                            id="confirm"
                        >

                    </div>


                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Modifier le mot de passe
                    </button>

                </form>

            </section>


            <section class="account-card">

                <div>

                    <h2>
                        Authentification renforcée
                    </h2>

                    <p>
                        Cette fonctionnalité pourra être activée
                        ultérieurement.
                    </p>

                </div>

                <span class="status-badge">
                    Bientôt disponible
                </span>

            </section>

        </main>

    </div>

</body>

</html>
