<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter une dépense - WANDJI FINANCE</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="dashboard.html" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="transactions.html">Transactions</a>
                <a href="revenues.html">Revenus</a>
                <a href="expenses.html" class="active">Dépenses</a>
                <a href="budgets.html">Budgets</a>
                <a href="goals.html">Objectifs</a>
                <a href="profile.html">Profil</a>
                <a href="settings.html">Paramètres</a>

            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        DÉPENSES
                    </span>

                    <h1>
                        Ajouter une dépense
                    </h1>

                    <p>
                        Enregistrez une nouvelle sortie d'argent.
                    </p>

                </div>

            </header>


            <section class="form-card">

                <form>

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            placeholder="Ex : Courses"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="amount">
                                Montant
                            </label>

                            <input
                                type="number"
                                id="amount"
                                placeholder="0"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Catégorie
                            </label>

                            <select id="category">

                                <option>
                                    Alimentation
                                </option>

                                <option>
                                    Transport
                                </option>

                                <option>
                                    Logement
                                </option>

                                <option>
                                    Abonnements
                                </option>

                                <option>
                                    Autre
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                        >

                    </div>


                    <div class="form-group">

                        <label for="note">
                            Note
                        </label>

                        <textarea
                            id="note"
                            placeholder="Informations supplémentaires..."
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <a href="expenses.html" class="button button-secondary">
                            Annuler
                        </a>

                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Enregistrer la dépense
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
