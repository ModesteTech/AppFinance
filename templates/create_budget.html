<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un budget - WANDJI FINANCE</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="dashboard.html" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="transactions.html">Transactions</a>
                <a href="budgets.html" class="active">Budgets</a>
                <a href="goals.html">Objectifs</a>
                <a href="profile.html">Profil</a>
                <a href="settings.html">Paramètres</a>

            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        BUDGETS
                    </span>

                    <h1>
                        Créer un budget
                    </h1>

                    <p>
                        Définissez une limite pour une catégorie de dépenses.
                    </p>

                </div>

            </header>


            <section class="form-card">

                <form>

                    <div class="form-group">

                        <label for="name">
                            Nom du budget
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Ex : Alimentation"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Catégorie
                        </label>

                        <select id="category">

                            <option>
                                Alimentation
                            </option>

                            <option>
                                Transport
                            </option>

                            <option>
                                Loisirs
                            </option>

                            <option>
                                Logement
                            </option>

                            <option>
                                Autre
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="amount">
                            Montant maximum
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="100000"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="start">
                                Date de début
                            </label>

                            <input
                                type="date"
                                id="start"
                            >

                        </div>


                        <div class="form-group">

                            <label for="end">
                                Date de fin
                            </label>

                            <input
                                type="date"
                                id="end"
                            >

                        </div>

                    </div>


                    <div class="form-actions">

                        <a href="budgets.html" class="button button-secondary">
                            Annuler
                        </a>

                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Créer le budget
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
