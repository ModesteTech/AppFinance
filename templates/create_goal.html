<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un objectif - WANDJI FINANCE</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <a href="dashboard.html" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Tableau de bord</a>
                <a href="transactions.html">Transactions</a>
                <a href="budgets.html">Budgets</a>
                <a href="goals.html" class="active">Objectifs</a>
                <a href="profile.html">Profil</a>
                <a href="settings.html">Paramètres</a>

            </nav>

        </aside>


        <main class="dashboard-main">

            <header class="page-header">

                <div>

                    <span class="dashboard-label">
                        OBJECTIFS
                    </span>

                    <h1>
                        Créer un objectif
                    </h1>

                    <p>
                        Donnez un montant et une date à votre projet.
                    </p>

                </div>

            </header>


            <section class="form-card">

                <form>

                    <div class="form-group">

                        <label for="name">
                            Nom de l'objectif
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Ex : Acheter un ordinateur"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="target">
                            Montant cible
                        </label>

                        <input
                            type="number"
                            id="target"
                            placeholder="900000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Date limite
                        </label>

                        <input
                            type="date"
                            id="deadline"
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Décrivez votre objectif..."
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <a href="goals.html" class="button button-secondary">
                            Annuler
                        </a>

                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Créer l'objectif
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
