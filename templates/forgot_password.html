<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié - WANDJI FINANCE</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">

                <a href="index.html" class="logo">
                    <span class="logo-mark">W</span>
                    <span class="logo-text">WANDJI FINANCE</span>
                </a>

                <h1>
                    Pas de panique.
                </h1>

                <p>
                    Nous allons vous aider à récupérer votre compte.
                </p>

            </div>


            <div class="auth-card">

                <div class="auth-card-header">

                    <h2>
                        Mot de passe oublié ?
                    </h2>

                    <p>
                        Entrez votre adresse email pour recevoir
                        les instructions de réinitialisation.
                    </p>

                </div>


                <form class="auth-form">

                    <div class="form-group">

                        <label for="email">
                            Adresse email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemple@email.com"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="button button-primary button-full"
                    >
                        Envoyer les instructions
                    </button>

                </form>


                <div class="auth-footer">

                    <a href="login.html">
                        ← Retour à la connexion
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
